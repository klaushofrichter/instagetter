name: Deploy production

on:
  push:
    branches: [production]

permissions:
  contents: write   # create the release tag
  packages: write

jobs:
  deploy:
    runs-on: [self-hosted, k3s]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # release notes are computed from history and tags

      - name: Install kubectl and configure in-cluster access
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi
          kubectl version --client
          # Plain kubectl (unlike client-go) does not auto-detect in-cluster
          # config from the mounted ServiceAccount — build a kubeconfig from it.
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster in-cluster \
            --server=https://kubernetes.default.svc \
            --certificate-authority="${SA_DIR}/ca.crt"
          kubectl config set-credentials deploy-sa --token="$(cat "${SA_DIR}/token")"
          kubectl config set-context in-cluster --cluster=in-cluster --user=deploy-sa --namespace=insta
          kubectl config use-context in-cluster

      - name: Generate the version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Calendar versioning, generated here rather than carried in the
          # sources: nothing to remember to bump, and the number says when the
          # build shipped. Dated in Central time so an evening deploy is not
          # filed under tomorrow.
          DATE=$(TZ=America/Chicago date +%Y.%m.%d)
          # Same-day counter, derived from the releases that already exist —
          # the tags are the state, so nothing needs storing.
          # Split deliberately: with the whole pipeline under `|| true`, a gh
          # failure (rate limit, API blip) is indistinguishable from "no
          # releases today" -- TODAY becomes 0, the counter resets to .1, and
          # an already-published image tag gets overwritten with different
          # code. `set -e` fails the step on a gh error instead; `|| true`
          # stays on grep alone, where no matches is a legitimate zero.
          RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                       --json tagName -q '.[].tagName')
          TODAY=$(printf '%s\n' "$RELEASES" | grep -c "^v${DATE}\." || true)
          VERSION="${DATE}.$((TODAY + 1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # latest is published here rather than from main, so that pulling it
          # gives what is actually deployed rather than an untested build.
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/klaushofrichter/instagetter:${{ github.sha }}
            ghcr.io/klaushofrichter/instagetter:v${{ steps.ver.outputs.version }}
            ghcr.io/klaushofrichter/instagetter:latest

      - name: Prune old Docker images
        run: docker system prune -af --filter "until=168h" || true

      - name: Update kube-setup manifest and deploy
        env:
          KUBE_SETUP_DEPLOY_TOKEN: ${{ secrets.KUBE_SETUP_DEPLOY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/kube-setup-deploy
          git clone "https://x-access-token:${KUBE_SETUP_DEPLOY_TOKEN}@github.com/klaushofrichter/kube-setup.git" /tmp/kube-setup-deploy
          cd /tmp/kube-setup-deploy
          sed -i "s|image: ghcr.io/klaushofrichter/instagetter:.*|image: ghcr.io/klaushofrichter/instagetter:${SHA}|" manifests/insta/insta-ksvc.yaml
          grep -q "image: ghcr.io/klaushofrichter/instagetter:${SHA}$" manifests/insta/insta-ksvc.yaml \
            || { echo "::error::manifest image line did not update to ${SHA}"; exit 1; }
          git config user.name "instagetter-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/insta/insta-ksvc.yaml
          if git diff --cached --quiet; then
            echo "No manifest change (image tag already up to date) — skipping commit/push."
          else
            git commit -m "Deploy instagetter ${SHA}"
            git push
          fi
          kubectl apply -f manifests/insta/insta-ksvc.yaml
          rm -rf /tmp/kube-setup-deploy

      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl wait --for=condition=Ready ksvc/insta -n insta --timeout=120s
          kubectl get ksvc insta -n insta

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already released — version not bumped, skipping."
            exit 0
          fi
          # Notes: whatever was curated under Unreleased, then the commits
          # since the previous release. Neither needs maintaining for a release
          # to be readable.
          : > /tmp/notes.md
          awk '
            /^## \[Unreleased\]/ { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > /tmp/curated.md
          if [ -s /tmp/curated.md ]; then
            cat /tmp/curated.md >> /tmp/notes.md
            printf '\n' >> /tmp/notes.md
          fi
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                   --json tagName -q '.[0].tagName' 2>/dev/null || true)
          printf '### Changes\n\n' >> /tmp/notes.md
          if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
            git log --no-merges --pretty='- %s' "${PREV}..HEAD" >> /tmp/notes.md
            printf '\n**Full diff**: %s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$PREV" "$TAG" >> /tmp/notes.md
          else
            git log --no-merges --pretty='- %s' -20 >> /tmp/notes.md
          fi
          printf '\nImage: `ghcr.io/klaushofrichter/instagetter:%s`\n' "$TAG" >> /tmp/notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file /tmp/notes.md
          echo "Released $TAG"

      - name: Smoke-test the public endpoints
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Poll for the version this run stamped, not merely for a 200.
          # Knative ingress can answer from the PREVIOUS revision for a moment
          # after the ksvc reports Ready, so a 200 alone lets a deploy pass
          # without the new build ever serving traffic.
          served=""
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" https://insta.klaushofrichter.net/health || true)
            if [ "$code" = "200" ]; then
              # Whitespace-tolerant on purpose: express emits no spaces, but
              # pinning the extraction to exact JSON byte spacing would break
              # silently if anything ever reformatted the body.
              served=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                         /tmp/health.json | head -1 || true)
              if [ "$served" = "$VERSION" ]; then
                echo "health ok, serving ${served}"
                break
              fi
              echo "health 200 but serving '${served}', want '${VERSION}', retry ${i}/10"
            else
              echo "health not ready (HTTP ${code}), retry ${i}/10"
            fi
            sleep 6
          done
          [ "$code" = "200" ] || { echo "::error::/health did not return 200"; exit 1; }
          [ "$served" = "$VERSION" ] || {
            echo "::error::/health reports '${served}', expected '${VERSION}' — ingress is still on the old revision"
            exit 1
          }
          page=$(curl -s -o /dev/null -w "%{http_code}" https://insta.klaushofrichter.net/)
          [ "$page" = "200" ] || { echo "::error::public page returned ${page}"; exit 1; }
          echo "public page ok"
