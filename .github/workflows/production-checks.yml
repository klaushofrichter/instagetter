name: PR checks

# Both branches, not just production. PRs to main -- Dependabot's in
# particular -- previously ran nothing at all: build-push.yml triggers on push,
# and this file only listened for production. Dependency bumps were landing on
# main unverified and were first tested when someone opened the promotion PR.
on:
  pull_request:
    branches: [main, production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Dependabot notices a vulnerable dependency, but noticing is not
      # blocking: without this step a package with a known advisory can be
      # merged and deployed while its fix PR sits open. This lives in `test`
      # rather than a job of its own because `test` is a required check on
      # production -- a separate job would gate nothing.
      #
      # Threshold is `high` rather than the default so that a moderate advisory
      # whose only fix is a major upgrade cannot wedge unrelated merges; the
      # alerts still surface those, they just do not stop the queue.
      - run: npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          # Upload to code scanning (free for public repos) so findings land in
          # the Security tab with full location and dataflow detail. `output`
          # also keeps a local copy so the gate below can still fail the job:
          # alerts on their own do not fail a check, and this check is required
          # for merging into production.
          output: sarif-results
          upload: always

      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          total=0
          for f in sarif-results/*.sarif; do
            count=$(jq '[.runs[].results[]] | length' "$f")
            total=$((total + count))
            # Print each finding inline so a failure is actionable from the
            # log alone, without opening the Security tab.
            jq -r '
              .runs[] as $run
              | $run.results[]?
              | . as $r
              | ($r.locations[0].physicalLocation // {}) as $loc
              | "::error file=\($loc.artifactLocation.uri // "?"),line=\($loc.region.startLine // 0)::[\($r.ruleId // "?")] \($r.message.text // "")"
            ' "$f"
          done
          echo "CodeQL findings: $total"
          if [ "$total" -gt 0 ]; then
            echo "::error::CodeQL found $total finding(s) — blocking merge. Details: Security tab > Code scanning"
            exit 1
          fi
